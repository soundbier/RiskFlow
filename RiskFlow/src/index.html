<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0284c7">
  <meta name="description" content="RiskFlow – Progressive Web App für Gefährdungsbeurteilungen, Risikobewertung und Arbeitsschutzmanagement">
  
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="RiskFlow">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="stylesheet" href="/src/css/style.css">
  
  <title>RiskFlow – Gefährdungsbeurteilungen</title>
</head>
<body>
  <div id="app"></div>
  
  <script type="module">
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', async () => {
        try {
          const registration = await navigator.serviceWorker.register('/sw.js', {
            scope: '/'
          });
          console.log('RiskFlow Service Worker registriert:', registration);
        } catch (error) {
          console.error('Service Worker Registrierung fehlgeschlagen:', error);
        }
      });
    }
  </script>
  
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
