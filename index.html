<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="RiskFlow - Mobile Arbeitsplatzinspektion" />
  
  <title>RiskFlow</title>
  
  <!-- Favicon & Icons -->
  <link rel="icon" type="image/x-icon" href="/public/icons/favicon.ico" />
  <link rel="apple-touch-icon" href="/public/icons/icon-192.png">

  <!-- Zentrales Stylesheet (wird von Vite geparst) -->
  <link rel="stylesheet" href="/src/css/style.css" />
</head>
<body>
  
  <!-- Hauptcontainer der App -->
  <div id="app" class="app-container">
    
    <!-- App Header -->
    <header class="app-header">
      <div class="header-logo">
        <h1>RiskFlow</h1>
      </div>
      <div class="header-actions">
        <!-- Der Button, der das neue Einstellungsmenü öffnet -->
        <button id="open-settings-btn" class="btn-icon" aria-label="Einstellungen öffnen">
          <i class="icon-settings" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- Main Workspace (Hier lebt die eigentliche Anwendung) -->
    <main class="workspace">
      <!-- Platzhalter: Hier befindet sich dein bestehender Code für Betriebe und Inspektionen -->
      <div class="dashboard-placeholder">
        <h2>Dashboard</h2>
        <p>Wählen Sie einen Betrieb oder eine Abteilung für die nächste Prüfung aus.</p>
      </div>
    </main>

    <!-- ============================================== -->
    <!-- Das Einstellungs-Modal wird nun dynamisch      -->
    <!-- durch src/js/modules/app.js gerendert          -->
    <!-- ============================================== -->
    
  </div>

  <!-- Vite Entry-Point (Vanilla JS) -->
  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
